<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy - Student Finance Manager</title>
</head>

<body>

    <header>
        
        <h1>BudgetBuddy</h1>

        <p>Your personal student finance manager.</p>

        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#expenses">Expenses</a>
            <a href="budget">Budget</a>
        </nav>

    </header>

    <main>

        <section id = "dashboard">

            <h2>My Dashboard</h2>

            <p>Welcome to your financial dashboard.</p>

            <h3>Current Balance</h3>
            <p>Rs10,000</p>

            <h3>Total Expense</h3>
            <p>Rs2,500</p>

        </section>

        <section id = "expenses">

            <h2>Add New Expense</h2>

            <form>
                
                <label for="expense-name">
                    Expense Name
                </label>

                <input
                     type="text"
                     id = "expense-name"
                     placeholder = "e.g. Lunch"
                >

                <br><br>

                <label for="expense-amount">
                    Amount
                </label>

                <input 
                    type="number"
                    id="expense-amount"
                    placeholder = "Enter amount"
                >

                <br><br>

                <button type = "submit">
                    Add Expense
                </button>
    
            </form>

        </section>

        <section id = "budget">

            <h2>My Budget</h2>

            <p>Monthly Budget: Rs10,000</p>

        </section>

    </main>

    <footer>
        <p>© 2026 BudgetBuddy. All rights reserved.</p>
    </footer>

</body>

</html>
